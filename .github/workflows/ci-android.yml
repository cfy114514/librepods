name: Android Debug CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or commit to build
        required: true
        default: main
  workflow_call:

# This fork validates debug builds without upstream release keys or publishing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override v3's default: Google no longer serves the legacy "tools" package.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install project SDK and native build tools
        id: sdk
        # Keep these versions in sync with android/app/build.gradle.kts.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/build
          sdkmanager --list --channel=3 > android/build/ci-sdk-packages.log 2>&1
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1" \
            2>&1 | tee android/build/ci-sdk-install.log
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/ndk/30.0.14904198/source.properties"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Test, build debug APK, and run lint
        id: verify
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p build
          ./gradlew --no-daemon --stacktrace --continue \
            testFossDebugUnitTest assembleFossDebug lintFossDebug \
            2>&1 | tee build/ci-gradle.log

      - name: Checksum debug APK
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -f android/app/build/outputs/apk/foss/debug/app-foss-debug.apk ]]; then
            cd android/app/build/outputs/apk/foss/debug
            sha256sum app-foss-debug.apk > SHA256SUMS
          fi

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-foss-debug-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/foss/debug/*.apk
            android/app/build/outputs/apk/foss/debug/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/build/ci-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: ${{ !cancelled() }}
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          {
            echo '## LibrePods Android debug validation'
            echo "SDK installation step: ${SDK_OUTCOME}"
            echo "Build/test/lint step: ${VERIFY_OUTCOME}"
            echo "Checked-out commit: $(git rev-parse HEAD)"
            echo 'Artifacts, when produced: debug APK with SHA-256, unit test reports, lint reports, SDK installation logs, and Gradle log.'
            echo 'No release signing keys are used. No release or Discord notification is published.'
            echo 'CI does not validate AirPods 5 Bluetooth behavior on real hardware.'
          } >> "$GITHUB_STEP_SUMMARY"
